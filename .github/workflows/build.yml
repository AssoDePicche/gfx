name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Build Script
        run: |
          docker build --build-arg BUILD_TYPE=Release --build-arg BUILDKIT_INLINE_CACHE=1 --target exporter --output type=local,dest=. --progress=plain .

      - name: Verify and Package Build Artifacts
        id: package
        run: |
          echo "Checking exported files:"
          ls -la

          tar -czvf artifacts.tar.gz App-linux-x86_64 README.md LICENSE

      - name: Upload Build Artifact (PRs and Commits)
        uses: actions/upload-artifact@v4
        with:
          name: Gfx-linux-x86_64
          path: artifacts.tar.gz

      - name: Update 'latest' Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts.tar.gz"
          tag: "latest"
          commit: "main"
          name: "Latest Build"
          body: |
            ### Latest Changes:

            ${{ github.event.head_commit.message }}

            * **Triggered by:** `${{ github.actor }}`
            * **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
