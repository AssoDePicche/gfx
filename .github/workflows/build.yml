name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Build Script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh Release

      - name: Verify and Package Build Artifacts
        id: package
        run: |
          echo "Checking exported files:"
          ls -la

          tar -czvf artifacts.tar.gz Gfx-linux-x86_64 README.md LICENSE

      - name: Upload Build Artifact (For PRs and Commits)
        uses: actions/upload-artifact@v4
        with:
          name: Gfx-linux-x86_64-PR-${{ github.event.pull_request.number || github.sha }}
          path: artifacts.tar.gz

      - name: Update 'latest' Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts.tar.gz"
          tag: "latest"
          name: "Latest Release"
          body: |
            ### Latest Changes:

            ${{ github.event.head_commit.message }}

            * **Triggered by:** `${{ github.actor }}`
            * **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            * **Built on:** ${{ github.event.head_commit.timestamp }}
          allowUpdates: true
          removeArtifacts: true
          recreate: true
          makeLatest: true
